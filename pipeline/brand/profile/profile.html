<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Developpy profile picture</title>
<style>
  body { margin: 0; background: #000; display: flex; flex-direction: column; gap: 24px; padding: 24px; width: max-content; }
  .pfp { width: 1080px; height: 1080px; position: relative; overflow: hidden; display: grid; place-items: center; }
  .pfp img { width: 400px; height: auto; display: block; }
  .ink { background: #110b2f; }
  .gradient { background: linear-gradient(135deg, #4a34c9 0%, #7852fc 38%, #2a1f7a 72%, #110b2f 100%); }
  .lilac { background: #dedcfd; }
  .glow { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; background: radial-gradient(circle, rgb(120 82 252 / 0.55) 0%, rgb(120 82 252 / 0) 60%); right: -500px; bottom: -600px; }
</style></head>
<body>
<div class="pfp ink"><div class="glow"></div><img src="../logo/icona-white.svg" alt=""></div>
<div class="pfp gradient"><img src="../logo/icona-white.svg" alt=""></div>
<div class="pfp lilac"><img src="../logo/icona-darkviolet.svg" alt=""></div>
</body></html>
